name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r pipeline/requirements-dev.txt
      # No secrets needed: tests generate a throwaway session secret in-process,
      # and network (Planetary Computer) tests are skipped by default.
      - run: npm run check
        env:
          TERRAGENT_PYTHON: python
          NEXT_TELEMETRY_DISABLED: "1"
